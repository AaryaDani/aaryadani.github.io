# Content for the About Me page.
#
# Sections render in the order written here; entries within a section likewise.
#
# Per entry:
#   org      (required) organisation or project name, shown bold
#   date     (required) right-aligned, e.g. "May–Aug 2025"
#   role     subtitle, shown before the dot
#   team     subtitle, shown after the dot
#   bullets  list of achievements
#   link     optional "Read more" target
#   logo     path under assets/ -- only square SYMBOL marks work here.
#            Wordmarks shrink to illegibility; use `mono` instead.
#   logo_bg  hex background for the tile
#   mono     1-3 character fallback shown when no logo is set
#   roles    list of sub-positions at the same org, rendered on a connector
#            rail (LinkedIn style). Each takes role / date / team / bullets /
#            link. Use instead of a top-level role+bullets.
#   mono_color text colour for that fallback (default white)

sections:
